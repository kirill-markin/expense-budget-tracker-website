name: Content tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  content-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
