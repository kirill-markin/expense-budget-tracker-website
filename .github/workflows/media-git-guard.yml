name: Media Git guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  media-git-guard:
    name: Media Git guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.event.after }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Test media guard against real Git fixtures
        run: node --test scripts/checkMediaGit.test.mjs
      - name: Check every introduced commit
        env:
          MEDIA_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          MEDIA_HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          git fetch --no-tags origin "$MEDIA_BASE" "$MEDIA_HEAD"
          node scripts/checkMediaGit.ts commits "$MEDIA_BASE" "$MEDIA_HEAD"
